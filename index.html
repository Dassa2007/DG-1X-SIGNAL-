<script>
    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const resultArea = document.getElementById('resultArea');

        if (fileInput.files.length === 0) {
            alert('කරුණාකර මුලින්ම ෆයිල් එකක් තෝරන්න!');
            return;
        }

        const file = fileInput.files[0];
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', 'dg_dev'); 

        resultArea.innerHTML = 'અප්ලෝඩ් වෙමින් පවතී... කරුණාකර රැඳී සිටින්න.';

        try {
            // Cloudinary වෙත ෆයිල් එක යැවීම
            const response = await fetch('https://api.cloudinary.com/v1_1/wwb8ifud/auto/upload', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.secure_url) {
                const longUrl = data.secure_url;
                
                // TinyURL API එක හරහා ලින්ක් එක කෙටි කිරීම
                resultArea.innerHTML = 'ලින්ක් එක කෙටි කරමින් පවතී...';
                const shortResponse = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                const shortUrl = await shortResponse.text();

                resultArea.innerHTML = `<b>සාර්ථකයි! ඔබේ කෙටි ලින්ක් එක:</b><br><a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
            } else {
                resultArea.innerHTML = 'අප්ලෝඩ් කිරීම අසාර්ථකයි. නැවත උත්සාහ කරන්න.';
            }
        } catch (error) {
            console.error('Error:', error);
            resultArea.innerHTML = 'දෝෂයක් සිදු විය.';
        }
    }
</script>
